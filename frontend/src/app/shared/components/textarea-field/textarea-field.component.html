<!-- src/app/shared/components/textarea-field/textarea-field.component.html -->
<div class="field" [class.has-error]="isInvalid">
  <label *ngIf="label" class="field-label">
    {{ label }}<span *ngIf="required" class="required-star"> *</span>
  </label>

  <!-- Optional mini toolbar -->
  <div *ngIf="showToolbar" class="toolbar">
    <button type="button" class="toolbar-btn" title="Bold" (click)="insertFormatting('bold')"><b>B</b></button>
    <button type="button" class="toolbar-btn" title="Italic" (click)="insertFormatting('italic')"><i>I</i></button>
    <button type="button" class="toolbar-btn" title="Underline" (click)="insertFormatting('underline')"><u>U</u></button>
    <span class="toolbar-sep"></span>
    <button type="button" class="toolbar-btn" title="Bullet" (click)="insertFormatting('list')">• List</button>
  </div>

  <textarea
    class="field-textarea"
    [rows]="rows"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [attr.maxlength]="maxLength ?? null"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
    [class.is-invalid]="isInvalid"
  ></textarea>

  <div class="d-flex align-center gap-2">
    <small *ngIf="hint && !isInvalid" class="field-hint flex-1">{{ hint }}</small>
    <small *ngIf="isInvalid && firstError" class="field-error flex-1">{{ firstError }}</small>
    <small *ngIf="maxLength" class="char-count" [class.near-limit]="charCount >= maxLength * 0.9">
      {{ charCount }}/{{ maxLength }}
    </small>
  </div>
</div>
