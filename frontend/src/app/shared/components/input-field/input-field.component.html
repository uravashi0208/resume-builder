<!-- src/app/shared/components/input-field/input-field.component.html -->
<div class="field" [class.has-error]="isInvalid">
  <label *ngIf="label" class="field-label">
    {{ label }}<span *ngIf="required" class="required-star"> *</span>
  </label>

  <div class="field-control">
    <input
      class="field-input"
      [class.has-toggle]="type === 'password'"
      [type]="inputType"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="displayValue"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [class.is-invalid]="isInvalid"
      [attr.autocomplete]="autocomplete"
    />
    <button *ngIf="type === 'password'" type="button" class="field-toggle"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            (click)="showPassword = !showPassword">
      <svg *ngIf="!showPassword" viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg>
      <svg *ngIf="showPassword" viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M3 3l14 14M8.2 4.8A8 8 0 0 1 10 4.5c5.5 0 8.5 5.5 8.5 5.5a14 14 0 0 1-2.6 3.2M5.6 6.2A14 14 0 0 0 1.5 10S4.5 15.5 10 15.5c1.2 0 2.3-.3 3.3-.7M8.6 8.6a2.5 2.5 0 0 0 2.8 2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <small *ngIf="hint && !isInvalid" class="field-hint">{{ hint }}</small>
  <small *ngIf="isInvalid && firstError" class="field-error">{{ firstError }}</small>
</div>
