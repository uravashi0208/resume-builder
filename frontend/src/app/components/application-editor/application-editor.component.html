<div class="page-shell" style="--page-w:1440px">

  <app-page-header eyebrow="Application" [title]="editingId ? 'Edit' : 'New'" accent="application" [subtitle]="subtitle">
    <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
    <button type="button" class="btn-primary" (click)="save()" [disabled]="saving">{{ saving ? 'Saving...' : 'Save' }}</button>
  </app-page-header>

  <p class="msg-error mb-2" *ngIf="errorMsg">{{ errorMsg }}</p>
  <app-state *ngIf="loading" [loading]="true"></app-state>

  <form [formGroup]="form" *ngIf="!loading" class="editor-grid">

    <!-- Left: steps -->
    <app-side-nav class="rail" [items]="sections" [active]="activeSection" [numbered]="true" (select)="go($event)"></app-side-nav>

    <!-- Middle: progress + the active step -->
    <div class="editor-main">
      <div class="progress">
        <p class="progress-text">Step <b>{{ stepIndex + 1 }}</b> of {{ sections.length }} · {{ stepLabel }}</p>
        <div class="track"><div class="bar" [style.width.%]="progress"></div></div>
      </div>

      <app-form-section *ngIf="activeSection === 'company'" formGroupName="company" title="Company Details">
        <div class="d-grid grid-2 gap-3">
          <app-input-field label="Company Name" placeholder="e.g. Google" [required]="true" formControlName="companyName"></app-input-field>
          <app-input-field label="Applied Title" placeholder="e.g. Frontend Developer" [required]="true" formControlName="appliedTitle"></app-input-field>
        </div>
        <div class="d-grid grid-3 gap-3">
          <app-date-picker label="Apply Date" [required]="true" formControlName="applyDate"></app-date-picker>
          <app-input-field label="Location" placeholder="e.g. Bangalore, India" formControlName="location"></app-input-field>
          <app-select-field label="Status" [options]="statusOptions" formControlName="status"></app-select-field>
        </div>
        <app-rich-editor label="Job Description" placeholder="Paste the job description here, so you can read it later..."
          minHeight="220px" formControlName="jobDescription"></app-rich-editor>
      </app-form-section>

      <app-cv-form *ngIf="activeSection !== 'company'" [form]="profileForm" [section]="$any(activeSection)"></app-cv-form>

      <div class="step-nav">
        <button type="button" class="btn-ghost" [disabled]="stepIndex === 0" (click)="prev()"><app-icon name="back" [size]="14"></app-icon> Previous</button>
        <button type="button" class="btn-primary" *ngIf="!isLast" (click)="next()">Next <app-icon name="arrow-right" [size]="14"></app-icon></button>
        <button type="button" class="btn-primary" *ngIf="isLast" (click)="save()" [disabled]="saving">{{ saving ? 'Saving...' : 'Save application' }}</button>
      </div>
    </div>

    <!-- Right: live plain view of the CV (read-only) -->
    <aside class="preview">
      <div class="preview-head">
        <span class="eyebrow">Live preview</span>
        <span class="hint">Updates as you type</span>
      </div>
      <div class="preview-scroll"><app-cv-plain [profile]="previewProfile"></app-cv-plain></div>
    </aside>
  </form>
</div>
