<app-auth-layout
  heroTitle="Keep every application"
  heroAccent="in one place."
  heroSub="Your CV, the job description and the status of each application — saved online, ready to read whenever you need it.">

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <app-auth-card
      title="Welcome back" subtitle="Sign in to continue where you left off."
      submitLabel="Sign in" loadingLabel="Signing in…"
      [loading]="loading" [disabled]="loginForm.invalid" [errorMsg]="errorMsg" [infoMsg]="infoMsg"
      switchText="New here?" switchLabel="Create an account" switchLink="/register">

      <app-input-field label="Email" type="email" placeholder="you@example.com" autocomplete="email"
        [required]="true" formControlName="email"></app-input-field>
      <app-input-field label="Password" type="password" placeholder="Your password" autocomplete="current-password"
        [required]="true" formControlName="password"></app-input-field>

      <div extra class="auth-row">
        <button type="button" class="link-btn" [disabled]="resetting" (click)="forgotPassword()">
          {{ resetting ? 'Sending…' : 'Forgot password?' }}
        </button>
      </div>
    </app-auth-card>
  </form>
</app-auth-layout>
