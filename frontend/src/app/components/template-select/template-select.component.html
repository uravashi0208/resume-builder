<div class="page-shell" style="--page-w:1100px">
  <h2 class="page-title">Choose a Template</h2>
  <p class="text-muted mb-2">Template select kari details fill up karo</p>

  <div class="template-grid d-grid gap-5">
    <div class="template-card card card-round" *ngFor="let t of templates" (click)="selectTemplate(t.id)">

      <!-- Real template components rendered small, with FAKE sample data (not user's real data) -->
      <div class="thumb-frame">
        <div class="thumb-scale">
          <app-resume [profile]="t.sample"></app-resume>
        </div>
      </div>

      <h3 class="card-title">{{ t.name }}</h3>
      <button class="btn-add">Use this template</button>
    </div>
  </div>
</div>
