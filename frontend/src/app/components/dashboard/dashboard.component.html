<div class="page-shell" style="--page-w:1100px">
  <app-page-header eyebrow="Overview" title="My" accent="dashboard">
    <button class="btn-primary" *ngIf="profile" (click)="edit()">Edit Profile</button>
  </app-page-header>

  <app-state *ngIf="loading" [loading]="true"></app-state>

  <app-state *ngIf="!loading && notFound" [card]="true" message="You haven't created a profile yet.">
    <button class="btn-primary" (click)="edit()">Create Profile</button>
  </app-state>

  <app-cv-plain *ngIf="profile" [profile]="profile"></app-cv-plain>
</div>
