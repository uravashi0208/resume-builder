<div class="page-shell" style="--page-w:760px">
  <app-page-header eyebrow="Profile" title="Your" accent="details"></app-page-header>

  <form (ngSubmit)="onSubmit()" novalidate>
    <app-cv-form [form]="form"></app-cv-form>

    <p class="msg-success mb-2" *ngIf="successMsg">{{ successMsg }}</p>
    <p class="msg-error mb-2"   *ngIf="errorMsg">{{ errorMsg }}</p>

    <button type="submit" class="btn-primary" [disabled]="saving">
      {{ saving ? 'Saving...' : 'Save Profile' }}
    </button>
  </form>
</div>
