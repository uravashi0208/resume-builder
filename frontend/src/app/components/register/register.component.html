<app-auth-layout
  heroTitle="Your CV, every job"
  heroAccent="saved for later."
  heroSub="Create a free account and keep your CV, job descriptions and application status together — safe online.">

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
    <app-auth-card
      title="Get started" subtitle="It's free — set up your profile in minutes."
      submitLabel="Create account" loadingLabel="Creating…"
      [loading]="loading" [disabled]="registerForm.invalid" [errorMsg]="errorMsg"
      switchText="Already have an account?" switchLabel="Sign in" switchLink="/login">

      <app-input-field label="Email" type="email" placeholder="you@example.com" autocomplete="email"
        [required]="true" formControlName="email"></app-input-field>
      <app-input-field label="Password" type="password" placeholder="At least 6 characters" autocomplete="new-password"
        [required]="true" hint="Minimum 6 characters" formControlName="password"></app-input-field>
      <app-input-field label="Confirm password" type="password" placeholder="Repeat your password" autocomplete="new-password"
        [required]="true" formControlName="confirm"></app-input-field>
    </app-auth-card>
  </form>
</app-auth-layout>
