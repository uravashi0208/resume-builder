<app-auth-layout
  heroTitle="Your next role starts with a"
  heroAccent="great first page."
  heroSub="Create a free account and craft a résumé recruiters actually finish reading.">

  <form class="auth-card glass" [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
    <nav class="tabs auth-switch">
      <a routerLink="/login" routerLinkActive="active">Sign in</a>
      <a routerLink="/register" routerLinkActive="active">Create account</a>
    </nav>

    <h2 class="display">Get started</h2>
    <p class="auth-subtitle">It's free — build your first résumé in minutes.</p>

    <div class="auth-fields">
      <app-input-field label="Email" type="email" placeholder="you@example.com" autocomplete="email"
        [required]="true" [control]="registerForm.get('email')" formControlName="email">
      </app-input-field>
      <app-input-field label="Password" type="password" placeholder="At least 6 characters" autocomplete="new-password"
        [required]="true" hint="Minimum 6 characters"
        [control]="registerForm.get('password')" formControlName="password">
      </app-input-field>
      <app-input-field label="Confirm password" type="password" placeholder="Repeat your password" autocomplete="new-password"
        [required]="true" [control]="registerForm.get('confirm')" formControlName="confirm">
      </app-input-field>
    </div>

    <p class="msg-error" *ngIf="errorMsg">{{ errorMsg }}</p>

    <button type="submit" class="btn-primary btn-block" [disabled]="registerForm.invalid || loading">
      <span>{{ loading ? 'Creating…' : 'Create account' }}</span>
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none"><path d="M4 10h11m0 0l-4-4m4 4l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </form>
</app-auth-layout>
